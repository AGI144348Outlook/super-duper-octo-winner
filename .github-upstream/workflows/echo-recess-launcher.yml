name: Launch ECHO Recess
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/echo-recess-launcher.yml"

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch autonomous-agency Recess
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run echo-recess.yml --repo ${{ github.repository }} --ref autonomous-agency
          echo "Dispatched ECHO Recess on autonomous-agency."
