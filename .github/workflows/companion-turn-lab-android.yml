name: Companion Turn Lab Android APK (isolated)
on:
  workflow_dispatch:
jobs:
  lab-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/companion-turn-lab/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated lab debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: companion-turn-lab-debug-apk
          path: labs/companion-turn-lab/android/app/build/outputs/apk/debug/app-debug.apk
