name: Companion Turn Lab Android APK
on:
  workflow_dispatch:
jobs:
  isolated-lab-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated lab branch
        uses: actions/checkout@v4
        with:
          ref: lab/contract-three-request-companion-app
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Companion Turn Lab APK only
        working-directory: labs/companion-turn-lab/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Companion Turn Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-turn-lab-debug-apk
          path: labs/companion-turn-lab/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
