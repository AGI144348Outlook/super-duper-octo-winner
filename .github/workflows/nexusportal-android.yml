name: NexusPortal Android APK
on:
  push:
    branches:
      - feature/nexusportal-renderer-foundation
    paths:
      - 'nexusportal/android/**'
      - '.github/workflows/nexusportal-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: feature/nexusportal-renderer-foundation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: nexusportal/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexusportal-debug-apk
          path: nexusportal/android/app/build/outputs/apk/debug/*.apk
