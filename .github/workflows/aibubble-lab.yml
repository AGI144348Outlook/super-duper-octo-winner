name: AIBubble Lab - experimental APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Require experimental branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "aibubble-continuous-guidance-experiment" || {
            echo "Refusing to build outside the isolated experiment branch"; exit 1;
          }
      - name: Extract existing Android project
        run: unzip -q AIBubble.zip -d proj
      - name: Prepare separate Lab app identity and source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("proj")
          gradle=root/"app/build.gradle.kts"
          text=gradle.read_text()
          # Application ID is separate from the Kotlin namespace, allowing side-by-side install.
          matches=list(re.finditer(r'applicationId\s*=\s*"([^"]+)"',text))
          if len(matches)!=1:
              raise SystemExit("Expected exactly one applicationId in app/build.gradle.kts; refusing to alter identity blindly")
          old=matches[0].group(1)
          new=old+".lab"
          text=text[:matches[0].start(1)]+new+text[matches[0].end(1):]
          gradle.write_text(text)
          manifest=root/"app/src/main/AndroidManifest.xml"
          m=manifest.read_text()
          # Label is for human identification only; no permissions are changed.
          m=m.replace('android:label="@string/app_name"', 'android:label="AIBubble Lab"')
          manifest.write_text(m)
          dest=root/"app/src/main/java/com/aibubble/experiment"
          dest.mkdir(parents=True,exist_ok=True)
          for name in ("HebrewSessionControls.kt","GuidanceSessionController.kt"):
              src=Path("experiments/triggered-guidance")/name
              (dest/name).write_bytes(src.read_bytes())
          (dest/"TextAnchorTracker.kt").write_bytes(Path("experiments/text-anchor/TextAnchorTracker.kt").read_bytes())
          print("Lab package:",new)
          print("Source prototypes staged for compilation; not yet integrated with production overlay.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile experimental APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace
      - name: Rename Lab APK
        run: mv proj/app/build/outputs/apk/debug/app-debug.apk proj/app/build/outputs/apk/debug/AIBubble-Lab.apk
      - name: Upload AIBubble Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBubble-Lab-experimental-apk
          path: proj/app/build/outputs/apk/debug/AIBubble-Lab.apk
          if-no-files-found: error
